services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knovid
      POSTGRES_USER: knovid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - knovid_account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knovid -d knovid"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  knovid_account_data:
