# Only API_TOKEN is substituted by the nginx image's entrypoint.
# All nginx variables below must remain literal in the generated config.
upstream knovid_video {
    zone knovid_video 64k;
    server api:8080 resolve;
}
upstream knovid_accounts {
    zone knovid_accounts 64k;
    server accounts:3001 resolve;
}
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name knovid.art www.knovid.art;

    location = /_nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://knovid.art$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.knovid.art;
    ssl_certificate /etc/nginx/tls/knovid.art.pem;
    ssl_certificate_key /etc/nginx/tls/knovid.art.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://knovid.art$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name knovid.art;

    ssl_certificate /etc/nginx/tls/knovid.art.pem;
    ssl_certificate_key /etc/nginx/tls/knovid.art.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KNOVID_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /api/healthz {
        proxy_pass http://knovid_video/healthz;
    }
    location = /api/v1 {
        proxy_set_header Authorization "Bearer ${API_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://knovid_video/v1;
    }
    location ^~ /api/v1/ {
        proxy_set_header Authorization "Bearer ${API_TOKEN}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_pass http://knovid_video/v1/;
    }
    location ^~ /api/ {
        proxy_pass http://knovid_accounts;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
