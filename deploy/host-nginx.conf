server {
    listen 80;
    server_name knovid.art www.knovid.art;
    return 301 https://knovid.art$request_uri;
}

server {
    listen 443 ssl;
    server_name www.knovid.art;
    ssl_certificate /opt/knovid/shared/certs/knovid.art.pem;
    ssl_certificate_key /opt/knovid/shared/certs/knovid.art.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://knovid.art$request_uri;
}

server {
    listen 443 ssl;
    server_name knovid.art;
    ssl_certificate /opt/knovid/shared/certs/knovid.art.pem;
    ssl_certificate_key /opt/knovid/shared/certs/knovid.art.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 21m;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name knovid.art;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host knovid.art;
        proxy_set_header Connection "";
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
        proxy_buffering off;
    }
}
